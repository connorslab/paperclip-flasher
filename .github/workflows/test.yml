name: Test and build experimental preview
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  preview:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go test ./...
      - run: go vet ./...
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - run: python -m unittest discover -s tests -v
      - run: go build -trimpath -ldflags="-s -w" -o build/paperclip-controller ./controller
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
          CGO_ENABLED: '0'
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name PaperclipFlasher --add-data "build/paperclip-controller:build" --add-data "controller:controller" launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: PaperclipFlasher-${{ matrix.os }}-preview
          path: dist/*
